<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google-site-verification" content="wdrGBim_2XmtMrqxivze70saMiPQAiOhpmN3KAWb0Sw">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="Sysbench CPU 性能排行榜与样本统计">
    <title>Sysbench CPU 性能天梯</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-subtle: #f1f5f9;
            --surface-hover: #e8eef8;
            --line: #d8dee9;
            --line-strong: #b9c4d4;
            --text: #172033;
            --text-muted: #64748b;
            --text-soft: #94a3b8;
            --accent: #2563eb;
            --accent-strong: #1d4ed8;
            --accent-soft: rgba(37, 99, 235, 0.14);
            --danger: #dc2626;
            --danger-soft: rgba(220, 38, 38, 0.12);
            --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        }

        [data-theme="dark"] {
            --bg: #101522;
            --surface: #151b2a;
            --surface-subtle: #1d2434;
            --surface-hover: #252e42;
            --line: #30394b;
            --line-strong: #44506a;
            --text: #f8fafc;
            --text-muted: #aab4c5;
            --text-soft: #7f8ba2;
            --accent: #3b82f6;
            --accent-strong: #60a5fa;
            --accent-soft: rgba(59, 130, 246, 0.18);
            --danger: #f87171;
            --danger-soft: rgba(248, 113, 113, 0.14);
            --shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { min-width: 320px; scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.5;
            transition: background-color 160ms ease, color 160ms ease;
        }

        button, input { font: inherit; }
        button, a { -webkit-tap-highlight-color: transparent; }
        button { cursor: pointer; }
        button:disabled { cursor: not-allowed; }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 10;
            min-height: 60px;
            border-bottom: 1px solid var(--line);
            background: color-mix(in srgb, var(--surface) 94%, transparent);
            backdrop-filter: blur(14px);
        }

        .header-inner {
            width: min(1200px, 100%);
            min-height: 60px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            text-decoration: none;
            white-space: nowrap;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            display: block;
            border-radius: 50%;
            background: #111827;
            object-fit: contain;
        }

        .brand-name { font-size: 15px; font-weight: 700; letter-spacing: 0; }

        .desktop-nav, .mobile-nav { display: flex; align-items: center; gap: 4px; }

        .nav-link, .nav-button {
            min-height: 34px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 10px;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text-muted);
            background: transparent;
            font-size: 13px;
            text-decoration: none;
            transition: color 140ms ease, background-color 140ms ease, border-color 140ms ease;
        }

        .nav-link:hover, .nav-button:hover, .nav-link:focus-visible, .nav-button:focus-visible {
            color: var(--text);
            background: var(--surface-hover);
            border-color: var(--line);
            outline: none;
        }

        .nav-link[aria-current="page"] { color: var(--accent-strong); }
        .mobile-nav { display: none; }
        .mobile-menu { position: relative; }
        .mobile-menu summary { list-style: none; }
        .mobile-menu summary::-webkit-details-marker { display: none; }
        .mobile-menu[open] .mobile-menu-panel {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: min(250px, calc(100vw - 32px));
            padding: 8px;
            display: grid;
            gap: 4px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .mobile-menu-panel .nav-link { width: 100%; }

        .page-shell {
            width: min(1200px, 100%);
            margin: 0 auto;
            padding: 38px 24px 56px;
        }

        .hero {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            padding: 0 0 28px;
            border-bottom: 1px solid var(--line);
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--accent-strong);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        h1 { margin: 0; font-size: 42px; line-height: 1.15; letter-spacing: 0; }
        .hero-subtitle { margin: 10px 0 0; color: var(--text-muted); font-size: 15px; }

        .language-toggle, .view-toggle {
            display: inline-flex;
            flex: none;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--surface);
        }

        .language-toggle button, .view-toggle button {
            min-height: 34px;
            padding: 6px 12px;
            border: 0;
            color: var(--text-muted);
            background: transparent;
            font-size: 12px;
            transition: color 140ms ease, background-color 140ms ease;
        }

        .language-toggle button + button, .view-toggle button + button { border-left: 1px solid var(--line); }
        .language-toggle button:hover, .view-toggle button:hover { color: var(--text); background: var(--surface-hover); }
        .language-toggle button.active, .view-toggle button.active { color: #fff; background: var(--accent); }
        .language-toggle button.active + button, .view-toggle button.active + button { border-left-color: var(--accent); }

        .toolbar {
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-form { min-width: 0; flex: 1; display: flex; gap: 8px; }

        .search-input-wrap { min-width: 0; flex: 1; position: relative; }
        .search-input-wrap::before { content: "⌕"; position: absolute; left: 13px; top: 7px; color: var(--text-soft); font-size: 20px; line-height: 1; }

        .search-input {
            width: 100%;
            min-height: 40px;
            padding: 8px 14px 8px 38px;
            border: 1px solid var(--line);
            border-radius: 7px;
            color: var(--text);
            background: var(--surface);
            outline: none;
            transition: border-color 140ms ease, box-shadow 140ms ease;
        }

        .search-input::placeholder { color: var(--text-soft); }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

        .action-button {
            min-height: 40px;
            padding: 8px 15px;
            border: 1px solid var(--line);
            border-radius: 7px;
            color: var(--text-muted);
            background: var(--surface);
            font-size: 13px;
            transition: color 140ms ease, background-color 140ms ease, border-color 140ms ease;
        }

        .action-button:hover, .action-button:focus-visible { color: var(--text); background: var(--surface-hover); border-color: var(--line-strong); outline: none; }
        .action-button.primary { color: #fff; border-color: var(--accent); background: var(--accent); }
        .action-button.primary:hover, .action-button.primary:focus-visible { border-color: var(--accent-strong); background: var(--accent-strong); }
        .action-button.ghost-danger { color: var(--danger); }
        .action-button:disabled { opacity: 0.45; }

        .stats-grid {
            margin-top: 22px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
        }

        .stat-card {
            min-height: 112px;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .stat-label { color: var(--text-muted); font-size: 12px; }
        .stat-value { margin-top: 8px; color: var(--text); font-size: 27px; font-weight: 750; line-height: 1; }
        .stat-value.accent { color: var(--accent-strong); }

        .status-row {
            min-height: 26px;
            margin-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .status-message { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .status-message.error { color: var(--danger); }
        .status-message.success::before { content: "●"; margin-right: 7px; color: #22c55e; }
        .status-message.error::before { content: "!"; display: inline-grid; width: 16px; height: 16px; margin-right: 6px; place-items: center; border-radius: 50%; color: #fff; background: var(--danger); font-size: 11px; font-weight: 700; }

        .pagination {
            margin: 22px 0 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pagination-info { min-width: 128px; color: var(--text-muted); font-size: 13px; text-align: center; }
        .page-jump { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 12px; }
        .page-input { width: 54px; min-height: 34px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); background: var(--surface); text-align: center; }
        .page-input:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); }
        .pagination .action-button { min-height: 34px; padding: 6px 11px; }

        .results {
            min-height: 200px;
            display: grid;
            gap: 8px;
        }

        .cpu-group {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .group-toggle {
            width: 100%;
            min-height: 72px;
            padding: 13px 16px;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto auto;
            align-items: center;
            gap: 14px;
            border: 0;
            color: var(--text);
            background: transparent;
            text-align: left;
        }

        .group-toggle:hover, .group-toggle:focus-visible { background: var(--surface-hover); outline: none; }
        .rank-badge { min-width: 36px; padding: 5px 8px; border-radius: 6px; color: #fff; background: var(--accent); font-size: 12px; font-weight: 700; text-align: center; }
        .group-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; }
        .group-stats { display: flex; align-items: center; gap: 16px; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
        .group-chevron { color: var(--text-soft); font-size: 14px; transition: transform 140ms ease; }
        .group-toggle[aria-expanded="true"] .group-chevron { transform: rotate(180deg); }

        .group-content { display: none; border-top: 1px solid var(--line); background: var(--surface-subtle); }
        .group-content.open { display: block; }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; min-width: 620px; border-collapse: collapse; }
        th, td { padding: 11px 16px; border-bottom: 1px solid var(--line); text-align: left; font-size: 12px; }
        th { color: var(--text-muted); background: var(--surface); font-weight: 650; }
        td { color: var(--text); }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: var(--surface-hover); }
        .score-single { color: var(--accent-strong); font-weight: 700; }
        .score-multi { color: #e879f9; font-weight: 700; }

        .empty-state, .loading-state {
            padding: 54px 20px;
            border: 1px dashed var(--line-strong);
            border-radius: 8px;
            color: var(--text-muted);
            background: var(--surface);
            text-align: center;
        }

        .loading-spinner { width: 28px; height: 28px; margin: 0 auto 14px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 800ms linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 15px; }
        .empty-state p { margin: 0 0 16px; }

        .site-footer {
            margin-top: 38px;
            padding-top: 22px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            border-top: 1px solid var(--line);
            color: var(--text-muted);
            font-size: 12px;
        }

        .footer-links { display: flex; flex-wrap: wrap; gap: 14px; }
        .footer-links a { color: var(--text-muted); text-decoration: none; }
        .footer-links a:hover { color: var(--accent-strong); }

        @media (max-width: 980px) {
            .desktop-nav .nav-link:nth-last-child(-n + 2) { display: none; }
            .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 720px) {
            .header-inner { padding: 0 16px; }
            .desktop-nav { display: none; }
            .mobile-nav { display: flex; }
            .page-shell { padding: 28px 16px 40px; }
            h1 { font-size: 30px; }
            .hero { align-items: flex-start; flex-direction: column; padding-bottom: 22px; }
            .hero-tools { width: 100%; display: flex; justify-content: space-between; }
            .toolbar { align-items: stretch; flex-direction: column; }
            .search-form { width: 100%; }
            .view-toggle { align-self: flex-start; }
            .group-toggle { grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; }
            .group-stats { grid-column: 2 / -1; gap: 9px; overflow: hidden; font-size: 11px; }
            .site-footer { align-items: flex-start; flex-direction: column; }
        }

        @media (max-width: 460px) {
            h1 { font-size: 28px; }
            .search-form { flex-wrap: wrap; }
            .search-input-wrap { flex-basis: 100%; }
            .search-form .action-button { flex: 1; }
            .stats-grid { gap: 9px; }
            .stat-card { min-height: 96px; padding: 14px; }
            .stat-value { font-size: 21px; }
            .stat-label { font-size: 11px; }
            .group-toggle { min-height: 82px; padding: 11px 12px; }
            .group-title { font-size: 13px; }
            .group-stats { flex-wrap: wrap; white-space: normal; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
        }
    </style>
</head>

        (() => {
            "use strict";

            const DATA_URLS = [

                zh: {
                    eyebrow: "PERFORMANCE DATA", title: "CPU Performance Ladder For Sysbench", subtitle: "Sysbench 天梯图", themeLight: "亮色主题", themeDark: "深色主题",
                    goScript: "Go版本脚本", shellScript: "Shell版本脚本", projects: "所有项目主页", ranking: "排行榜天梯图", monitor: "VPS补货监控", searchLabel: "搜索 CPU 型号", searchPlaceholder: "输入关键词，浏览全部 CPU 型号", search: "搜索", clear: "清除", compact: "紧凑视图", detail: "详细视图", models: "CPU型号总数", samples: "测试样本数", topSingle: "最高单核分数", topMulti: "最高多核分数", loading: "正在加载排行榜数据...", loaded: "数据已更新", previous: "上一页", next: "下一页", jumpTo: "跳转到", page: "页", jump: "跳转", noMatch: "没有匹配的 CPU 型号", noMatchHint: "请尝试更换关键词。", noData: "暂时无法加载排行榜数据", noDataHint: "请稍后重试，或检查数据源是否可访问。", retry: "重新加载", samplesShort: "样本", singleMax: "单核最高", multiMax: "多核最高", model: "CPU型号", cores: "核心数", single: "单核分数", multi: "多核分数", threads: "多核线程", pageInfo: (page, total) => `第 ${page} 页，共 ${total} 页`, resultCount: count => `显示 ${count.toLocaleString()} 个型号`, footerScript: "测试脚本", footerPaste: "PasteBin 首页", footerHome: "spiritlhl 官网", footerCopyright: "本项目隶属于 spiritlhl 旗下", loadError: "数据源请求失败"
                },
                en: {
                    eyebrow: "PERFORMANCE DATA", title: "CPU Performance Ladder For Sysbench", subtitle: "Sysbench CPU benchmark rankings", themeLight: "Light theme", themeDark: "Dark theme",
                    goScript: "Go Script", shellScript: "Shell Script", projects: "All Projects", ranking: "CPU Rankings", monitor: "VPS Stock Monitor", searchLabel: "Search CPU model", searchPlaceholder: "Enter a keyword to browse CPU models", search: "Search", clear: "Clear", compact: "Compact view", detail: "Detailed view", models: "CPU models", samples: "Test samples", topSingle: "Highest single-core", topMulti: "Highest multi-core", loading: "Loading ranking data...", loaded: "Data updated", previous: "Previous", next: "Next", jumpTo: "Go to", page: "page", jump: "Go", noMatch: "No matching CPU models", noMatchHint: "Try another keyword.", noData: "Ranking data is unavailable", noDataHint: "Try again later or check the data source.", retry: "Retry", samplesShort: "Samples", singleMax: "Max single", multiMax: "Max multi", model: "CPU model", cores: "Cores", single: "Single score", multi: "Multi score", threads: "Multi threads", pageInfo: (page, total) => `Page ${page} of ${total}`, resultCount: count => `Showing ${count.toLocaleString()} models`, footerScript: "Test script", footerPaste: "PasteBin home", footerHome: "spiritlhl home", footerCopyright: "A spiritlhl project", loadError: "Data source request failed"
                }
            };

            const byId = id => document.getElementById(id);
            const state = { lang: "zh", theme: "dark", detail: false, term: "", page: 1, groups: [], filtered: [], totalRows: 0, totalSamples: 0, loading: true, statusKind: "loading", statusDetail: "" };

            function text(key, ...args) {
                const value = translations[state.lang][key];
                return typeof value === "function" ? value(...args) : value;
            }

            function setTheme(theme) {
                state.theme = theme === "light" ? "light" : "dark";
                document.documentElement.dataset.theme = state.theme;
                const light = state.theme === "light";
                const label = text(light ? "themeDark" : "themeLight");
                [byId("themeToggle"), byId("themeToggleMobile")].forEach(button => {
                    if (!button) return;
                    button.setAttribute("aria-pressed", String(!light));
                    const labelNode = button.querySelector("[data-i18n]");
                    if (labelNode) labelNode.textContent = label;
                    button.setAttribute("aria-label", label);
                });
                try { localStorage.setItem("rank-theme", state.theme); } catch (_) { /* private browsing */ }
            }

            function setLanguage(lang) {
                state.lang = lang === "en" ? "en" : "zh";
                document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
                document.querySelectorAll("[data-i18n]").forEach(node => {
                    const key = node.dataset.i18n;
                    if (translations[state.lang][key] && typeof translations[state.lang][key] !== "function") node.textContent = translations[state.lang][key];
                });
                document.querySelectorAll("[data-i18n-placeholder]").forEach(node => { node.placeholder = text(node.dataset.i18nPlaceholder); });
                byId("langZh").classList.toggle("active", state.lang === "zh");
                byId("langEn").classList.toggle("active", state.lang === "en");
                byId("langZh").setAttribute("aria-pressed", String(state.lang === "zh"));
                byId("langEn").setAttribute("aria-pressed", String(state.lang === "en"));
                setTheme(state.theme);
                refreshStatus();
                render();
            }

            function formatNumber(value) { return Number(value || 0).toLocaleString(); }
            function normalize(value) { return String(value ?? "").trim().toLocaleLowerCase(); }
            function validNumber(value) { return Number.isFinite(Number(value)) ? Number(value) : 0; }

            function normalizePayload(payload) {
                const source = Array.isArray(payload) ? payload : payload && Array.isArray(payload.cpu_statistics) ? payload.cpu_statistics : [];
                const rows = source.map((item, index) => {
                    if (!item || typeof item !== "object") return null;
                    const model = String(item.cpu_model ?? item.model ?? "").trim();
                    const prefix = String(item.cpu_prefix ?? "").trim() || model;
                    if (!model) return null;
                    return {
                        cpu_model: model,
                        cpu_prefix: prefix,
                        cpu_cores: Math.max(0, Math.round(validNumber(item.typical_cores ?? item.cpu_cores))),
                        single_score: Math.max(0, validNumber(item.max_single_score ?? item.single_score)),
                        multi_score: Math.max(0, validNumber(item.max_multi_score ?? item.multi_score)),
                        multi_threads: Math.max(0, Math.round(validNumber(item.typical_threads ?? item.multi_threads))),
                        rank: Math.max(0, Math.round(validNumber(item.rank))) || index + 1,
                        sample_count: Math.max(0, Math.round(validNumber(item.sample_count)))
                    };
                }).filter(Boolean);
                if (!rows.length) throw new Error("empty payload");
                return { rows, totalSamples: Math.max(0, Math.round(validNumber(payload && payload.total_samples))) };
            }

            async function fetchWithTimeout(url) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 9000);
                try {
                    const response = await fetch(url, { signal: controller.signal, cache: "no-store", headers: { Accept: "application/json" } });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return await response.json();
                } finally { clearTimeout(timer); }
            }

            async function loadData() {
                setLoading(true);
                let lastError = null;
                for (const url of DATA_URLS) {
                    try {
                        const payload = normalizePayload(await fetchWithTimeout(url));
                        state.groups = groupRows(payload.rows);
                        state.totalRows = payload.rows.length;
                        state.totalSamples = payload.totalSamples || payload.rows.reduce((sum, row) => sum + row.sample_count, 0);
                        state.page = 1;
                        state.loading = false;
                        setStatus("success");
                        updateStats(payload.rows);
                        render();
                        return;
                    } catch (error) { lastError = error; }
                }
                state.loading = false;
                setStatus("error", lastError ? "HTTP/JSON" : "unknown");
                renderError();
            }

            function summarizeGroup(prefix, values) {
                const sortedValues = [...values].sort((a, b) => b.single_score - a.single_score || b.multi_score - a.multi_score || a.cpu_model.localeCompare(b.cpu_model));
                return {
                    prefix,
                    values: sortedValues,
                    representative: sortedValues[0],
                    rank: Math.min(...sortedValues.map(row => row.rank || Number.MAX_SAFE_INTEGER)),
                    sampleCount: sortedValues.reduce((sum, row) => sum + row.sample_count, 0),
                    maxSingle: Math.max(...sortedValues.map(row => row.single_score)),
                    maxMulti: Math.max(...sortedValues.map(row => row.multi_score))
                };
            }

            function groupRows(rows) {
                const groups = new Map();
                rows.forEach(row => {
                    if (!groups.has(row.cpu_prefix)) groups.set(row.cpu_prefix, []);
                    groups.get(row.cpu_prefix).push(row);
                });
                return [...groups.entries()]
                    .map(([prefix, values]) => summarizeGroup(prefix, values))
                    .sort((a, b) => a.rank - b.rank || b.maxSingle - a.maxSingle || a.prefix.localeCompare(b.prefix));
            }

            function updateStats(rows) {
                byId("totalCpus").textContent = formatNumber(state.totalRows);
                byId("totalTests").textContent = formatNumber(state.totalSamples);
                byId("topSingle").textContent = formatNumber(Math.max(...rows.map(row => row.single_score)));
                byId("topMulti").textContent = formatNumber(Math.max(...rows.map(row => row.multi_score)));
            }

            function setLoading(isLoading) {
                state.loading = isLoading;
                if (isLoading) {
                    byId("loadingState").hidden = false;
                    byId("pagination").hidden = true;
                    setStatus("loading");
                }
            }

            function refreshStatus() {
                const node = byId("statusMessage");
                node.className = `status-message ${state.statusKind === "loading" ? "" : state.statusKind}`;
                if (state.statusKind === "success") node.textContent = text("loaded");
                else if (state.statusKind === "error") node.textContent = `${text("loadError")} (${state.statusDetail || "unknown"})`;
                else node.textContent = text("loading");
            }

            function setStatus(kind, detail = "") {
                state.statusKind = kind;
                state.statusDetail = detail;
                refreshStatus();
            }

            function getFilteredGroups() {
                const term = normalize(state.term);
                if (!term) return [...state.groups];
                return state.groups.map(group => {
                    const values = group.values.filter(row => normalize(`${row.cpu_model} ${row.cpu_prefix}`).includes(term));
                    return values.length ? summarizeGroup(group.prefix, values) : null;
                }).filter(Boolean);
            }

            function makeCell(value, className) {
                const cell = document.createElement("td");
                if (className) cell.className = className;
                cell.textContent = String(value);
                return cell;
            }

            function renderTable(group) {
                const tableWrap = document.createElement("div");
                tableWrap.className = "table-scroll";
                const table = document.createElement("table");
                const head = document.createElement("thead");
                const headRow = document.createElement("tr");
                const headers = state.detail ? [text("model"), text("cores"), text("single"), text("multi"), text("threads")] : [text("model"), text("cores"), text("single"), text("multi")];
                headers.forEach(label => { const th = document.createElement("th"); th.scope = "col"; th.textContent = label; headRow.appendChild(th); });
                head.appendChild(headRow);
                const body = document.createElement("tbody");
                const values = group.representative ? [group.representative] : [];
                values.forEach(row => {
                    const tr = document.createElement("tr");
                    tr.appendChild(makeCell(row.cpu_model));
                    tr.appendChild(makeCell(row.cpu_cores));
                    tr.appendChild(makeCell(formatNumber(row.single_score), "score-single"));
                    tr.appendChild(makeCell(formatNumber(row.multi_score), "score-multi"));
                    if (state.detail) tr.appendChild(makeCell(row.multi_threads));
                    body.appendChild(tr);
                });
                table.append(head, body);
                tableWrap.appendChild(table);
                return tableWrap;
            }

            function renderGroup(group, index) {
                const article = document.createElement("article");
                article.className = "cpu-group";
                const toggle = document.createElement("button");
                toggle.className = "group-toggle";
                toggle.type = "button";
                toggle.setAttribute("aria-expanded", "false");
                toggle.setAttribute("aria-controls", `group-content-${index}`);
                const badge = document.createElement("span"); badge.className = "rank-badge"; badge.textContent = `#${group.rank}`;
                const title = document.createElement("span"); title.className = "group-title"; title.textContent = group.representative.cpu_model;
                const stats = document.createElement("span"); stats.className = "group-stats";
                [[text("samplesShort"), formatNumber(group.sampleCount)], [text("singleMax"), formatNumber(group.maxSingle)], [text("multiMax"), formatNumber(group.maxMulti)]].forEach(([label, value]) => { const item = document.createElement("span"); item.textContent = `${label}: ${value}`; stats.appendChild(item); });
                const chevron = document.createElement("span"); chevron.className = "group-chevron"; chevron.setAttribute("aria-hidden", "true"); chevron.textContent = "▼";
                toggle.append(badge, title, stats, chevron);
                const content = document.createElement("div"); content.className = "group-content"; content.id = `group-content-${index}`; content.appendChild(renderTable(group));
                toggle.addEventListener("click", () => { const expanded = toggle.getAttribute("aria-expanded") === "true"; toggle.setAttribute("aria-expanded", String(!expanded)); content.classList.toggle("open", !expanded); });
                article.append(toggle, content);
                return article;
            }

            function render() {
                if (state.loading) return;
                state.filtered = getFilteredGroups();
                const totalPages = Math.max(1, Math.ceil(state.filtered.length / PAGE_SIZE));
                state.page = Math.min(Math.max(state.page, 1), totalPages);
                const start = (state.page - 1) * PAGE_SIZE;
                const visibleGroups = state.filtered.slice(start, start + PAGE_SIZE);
                const results = byId("results");
                results.replaceChildren();
                if (!visibleGroups.length) {
                    const empty = document.createElement("div"); empty.className = "empty-state";
                    const title = document.createElement("strong"); title.textContent = text("noMatch");
                    const hint = document.createElement("p"); hint.textContent = text("noMatchHint");
                    const clear = document.createElement("button"); clear.className = "action-button"; clear.type = "button"; clear.textContent = text("clear"); clear.addEventListener("click", clearSearch);
                    empty.append(title, hint, clear); results.appendChild(empty);
                } else visibleGroups.forEach((group, index) => results.appendChild(renderGroup(group, start + index)));
                byId("loadingState").hidden = true;
                byId("pagination").hidden = state.filtered.length === 0;
                byId("pageInfo").textContent = text("pageInfo", state.page, totalPages);
                byId("pageInput").value = state.page;
                byId("pageInput").max = totalPages;
                byId("prevPage").disabled = state.page <= 1;
                byId("nextPage").disabled = state.page >= totalPages;
                byId("resultCount").textContent = text("resultCount", state.filtered.length);
            }

            function renderError() {
                const results = byId("results"); results.replaceChildren();
                const empty = document.createElement("div"); empty.className = "empty-state";
                const title = document.createElement("strong"); title.textContent = text("noData");
                const hint = document.createElement("p"); hint.textContent = text("noDataHint");
                const retry = document.createElement("button"); retry.className = "action-button primary"; retry.type = "button"; retry.textContent = text("retry"); retry.addEventListener("click", loadData);
                empty.append(title, hint, retry); results.appendChild(empty);
                byId("loadingState").hidden = true;
                byId("pagination").hidden = true;
                byId("resultCount").textContent = "";
            }

            function clearSearch() { state.term = ""; state.page = 1; byId("searchInput").value = ""; render(); }

            byId("searchForm").addEventListener("submit", event => { event.preventDefault(); state.term = byId("searchInput").value; state.page = 1; render(); });
            byId("searchInput").addEventListener("input", event => { state.term = event.target.value; state.page = 1; render(); });
            byId("clearBtn").addEventListener("click", clearSearch);
            byId("compactView").addEventListener("click", () => { state.detail = false; byId("compactView").classList.add("active"); byId("detailView").classList.remove("active"); byId("compactView").setAttribute("aria-pressed", "true"); byId("detailView").setAttribute("aria-pressed", "false"); render(); });
            byId("detailView").addEventListener("click", () => { state.detail = true; byId("detailView").classList.add("active"); byId("compactView").classList.remove("active"); byId("detailView").setAttribute("aria-pressed", "true"); byId("compactView").setAttribute("aria-pressed", "false"); render(); });
            byId("prevPage").addEventListener("click", () => { if (state.page > 1) { state.page -= 1; render(); window.scrollTo({ top: 0, behavior: "smooth" }); } });
            byId("nextPage").addEventListener("click", () => { state.page += 1; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
            byId("jumpBtn").addEventListener("click", () => { const page = Number.parseInt(byId("pageInput").value, 10); if (Number.isFinite(page)) { state.page = page; render(); } });
            byId("pageInput").addEventListener("keydown", event => { if (event.key === "Enter") byId("jumpBtn").click(); });
            byId("langZh").addEventListener("click", () => setLanguage("zh"));
            byId("langEn").addEventListener("click", () => setLanguage("en"));
            [byId("themeToggle"), byId("themeToggleMobile")].forEach(button => button.addEventListener("click", () => setTheme(state.theme === "dark" ? "light" : "dark")));

            try { state.theme = localStorage.getItem("rank-theme") || "dark"; } catch (_) { state.theme = "dark"; }
            setTheme(state.theme);
            setLanguage("zh");
            loadData();
        })();
    </script>

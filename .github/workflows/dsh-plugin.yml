name: DSH Plugin Checks

on:
  push:
    branches: [master, public]
    paths: ['agent/dsh*', 'scripts/*dsh*', 'skills/oneclickvirt-ecs/*.json', 'package*.json', '.github/workflows/dsh-plugin.yml']
  pull_request:
    paths: ['agent/dsh*', 'scripts/*dsh*', 'skills/oneclickvirt-ecs/*.json', 'package*.json', '.github/workflows/dsh-plugin.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -- --check
      - run: npm run check
      - run: npm test
      - name: Verify Windows firewall preparation and cleanup
        if: runner.os == 'Windows'
        env:
          GOECS_FIREWALL_SMOKE: '1'
        run: node --test --test-name-pattern="native Windows firewall" agent/dsh-runtime.test.mjs
      - run: npm pack --dry-run
  native-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.2.2-rc.1, 0.2.2-rc.3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install isolated DSH services
        run: >-
          npm install --prefix "$RUNNER_TEMP/goecs-dsh-host" --ignore-scripts --no-audit --no-fund
          @deepseek-ai/cordis@4.1.0
          @deepseek-ai/dsh-tools@${{ matrix.dsh }}
          @deepseek-ai/dsh-system-prompt@${{ matrix.dsh }}
          @deepseek-ai/dsh-tool-executor-native@${{ matrix.dsh }}
      - run: node scripts/check_dsh_host.mjs "$RUNNER_TEMP/goecs-dsh-host"

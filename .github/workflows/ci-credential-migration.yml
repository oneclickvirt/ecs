name: Migrate private CI credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    if: github.repository_owner == 'oneclickvirt' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare encryption support
        run: python3 -m pip install --quiet --disable-pip-version-check pynacl > "$RUNNER_TEMP/ci-install.log" 2>&1 || { echo "Credential setup failed"; exit 1; }
      - name: Encrypt credentials for public launchers
        env:
          CI_TOKEN: ${{ secrets.GHT }}
        run: |
          python3 - <<'PYCODE'
          import os,json,base64,urllib.request
          from nacl.public import PublicKey,SealedBox
          token=os.environ['CI_TOKEN']
          def call(path,method='GET',body=None):
              req=urllib.request.Request('https://api.github.com'+path,method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as f:
                  data=f.read()
              return json.loads(data) if data else None
          try:
              if not token:raise ValueError()
              for private in ['security','privatespeedtest','openspeedtest','ICMPTargetSpiders','jks']:
                  if not call('/repos/oneclickvirt/'+private)['private']:raise ValueError()
              for target in ['ecs','ecs-gui','securityCheck','cnprivatespeedtest','speedtest','pingtest']:
                  path='/repos/oneclickvirt/'+target+'/actions/secrets'
                  key=call(path+'/public-key')
                  encrypted=base64.b64encode(SealedBox(PublicKey(base64.b64decode(key['key']))).encrypt(token.encode())).decode()
                  call(path+'/PRIVATE_CI_TOKEN','PUT',{'key_id':key['key_id'],'encrypted_value':encrypted})
          except BaseException:
              raise SystemExit('Credential migration failed; no credential values are printed') from None
          print('Public launcher credentials configured')
          PYCODE

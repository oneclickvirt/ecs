name: Public Build
on:
  workflow_run:
    workflows: ["Build and Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish, for example v0.1.181"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: public-latest-release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_tag }}
        fetch-depth: 0
        fetch-tags: true
    - name: Resolve release context
      id: release
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        set -euo pipefail
        RESOLVER=".github/scripts/resolve-release-context.sh"
        if [ -f "$RESOLVER" ]; then
          bash "$RESOLVER"
        else
          git fetch --depth=1 origin master
          git show FETCH_HEAD:"$RESOLVER" | bash
        fi
    - name: Set up Go
      if: steps.release.outputs.publish == 'true'
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        check-latest: true

    - name: Resolve embedded resolver catalog ref
      id: resolver_catalog
      if: steps.release.outputs.publish == 'true'
      shell: bash
      run: |
        set -euo pipefail
        BASICS_REF="$(go mod edit -json | python3 -c 'import json, sys; required = {item["Path"]: item["Version"] for item in json.load(sys.stdin).get("Require", [])}; print(required["github.com/oneclickvirt/basics"])')"
        [[ "$BASICS_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid basics release ref: $BASICS_REF" >&2; exit 1; }
        echo "ref=$BASICS_REF" >> "$GITHUB_OUTPUT"

    - name: Checkout immutable resolver catalog
      if: steps.release.outputs.publish == 'true'
      uses: actions/checkout@v4
      with:
        repository: oneclickvirt/basics
        ref: ${{ steps.resolver_catalog.outputs.ref }}
        path: .release-basics
        token: ${{ secrets.GHT }}

    - name: Verify immutable resolver catalog
      if: steps.release.outputs.publish == 'true'
      shell: bash
      env:
        BASICS_REF: ${{ steps.resolver_catalog.outputs.ref }}
      run: |
        set -euo pipefail
        test -s .release-basics/network/resolver/endpoints_embed.json
        if ! git -C .release-basics tag --points-at HEAD | grep -Fx -- "$BASICS_REF" >/dev/null; then
          echo "Resolver catalog checkout is not the requested immutable tag: $BASICS_REF" >&2
          exit 1
        fi
        go -C .release-basics test -count=1 ./network/resolver ./cmd/update-resolver-endpoints
        printf 'Embedded resolver catalog from basics %s: ' "$BASICS_REF" >> "$GITHUB_STEP_SUMMARY"
        sha256sum .release-basics/network/resolver/endpoints_embed.json >> "$GITHUB_STEP_SUMMARY"

    - name: Remove temporary resolver catalog checkout
      if: steps.release.outputs.publish == 'true'
      shell: bash
      run: rm -rf .release-basics

    - name: Create public branch
      if: steps.release.outputs.publish == 'true'
      run: |
        # 删除本地 public 分支（如果存在）
        git branch -D public 2>/dev/null || true
        # 基于当前分支创建新的 public 分支（完全覆盖）
        git checkout -b public
        
    - name: Generate dependency-clean public tree
      if: steps.release.outputs.publish == 'true'
      run: |
        set -euo pipefail
        python3 .back/create_public_branch.py
        go mod tidy
        go clean -cache -testcache -fuzzcache
        for artifact in .github/workflows/build_binary.yaml .github/workflows/build_public.yml; do
          if [ -e "$artifact" ]; then
            echo "Public branch retained a workflow that loads private modules: $artifact" >&2
            exit 1
          fi
        done
        if rg -n 'github\.com/oneclickvirt/(security|privatespeedtest)' --glob '*.go' --glob 'go.mod' --glob 'go.sum' .; then
          echo "Public module metadata still references private modules" >&2
          exit 1
        fi
        if rg -n 'github\.com/oneclickvirt/(security|privatespeedtest)' .github/workflows; then
          echo "Public workflow still loads a private module" >&2
          exit 1
        fi
        if go list -deps ./... | grep -E '^github\.com/oneclickvirt/(security|privatespeedtest)(/|$)'; then
          echo "Default public build dependency graph still loads private modules" >&2
          exit 1
        fi
        if go list -tags=ecs_public -deps ./... | grep -E '^github\.com/oneclickvirt/(security|privatespeedtest)(/|$)'; then
          echo "Tagged public build dependency graph still loads private modules" >&2
          exit 1
        fi
    - name: Build and Test
      if: steps.release.outputs.publish == 'true'
      run: |
        set -euo pipefail
        go test ./...
        go build -ldflags="-checklinkname=0" -o maintest
        ./maintest -h >/dev/null
        go run ./cmd/ecs-canary -offline -canary-deadline 30s > public-canary.json
        python3 -m json.tool public-canary.json >/dev/null
        go test -tags=ecs_public ./...
        go build -tags=ecs_public -ldflags="-checklinkname=0" -o maintest-ecs-public
        ./maintest-ecs-public -h >/dev/null
        rm -f maintest maintest-ecs-public public-canary.json
        
    - name: Commit and push changes
      if: steps.release.outputs.publish == 'true'
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "Public branch generator produced no changes" >&2
          exit 1
        fi
        git commit -m "Auto update public version"
        git push -f origin public

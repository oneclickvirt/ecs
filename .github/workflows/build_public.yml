name: Public Build
on:
  workflow_run:
    workflows: ["Build and Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish, for example v0.1.181"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: public-latest-release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_tag }}
        fetch-depth: 0
        fetch-tags: true
    - name: Resolve release context
      id: release
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        set -euo pipefail
        RESOLVER=".github/scripts/resolve-release-context.sh"
        if [ -f "$RESOLVER" ]; then
          bash "$RESOLVER"
        else
          git fetch --depth=1 origin master
          git show FETCH_HEAD:"$RESOLVER" | bash
        fi
    - name: Set up Go
      if: steps.release.outputs.publish == 'true'
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        check-latest: true

    - name: Resolve embedded resolver catalog ref
      id: resolver_catalog
      if: steps.release.outputs.publish == 'true'
      shell: bash
      run: |
        set -euo pipefail
        BASICS_REF="$(go mod edit -json | python3 -c 'import json, sys; required = {item["Path"]: item["Version"] for item in json.load(sys.stdin).get("Require", [])}; print(required["github.com/oneclickvirt/basics"])')"
        [[ "$BASICS_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid basics release ref: $BASICS_REF" >&2; exit 1; }
        echo "ref=$BASICS_REF" >> "$GITHUB_OUTPUT"

    - name: Checkout immutable resolver catalog
      if: steps.release.outputs.publish == 'true'
      uses: actions/checkout@v4
      with:
        repository: oneclickvirt/basics
        ref: ${{ steps.resolver_catalog.outputs.ref }}
        path: .release-basics
        token: ${{ secrets.GHT }}

    - name: Verify immutable resolver catalog
      if: steps.release.outputs.publish == 'true'
      shell: bash
      env:
        BASICS_REF: ${{ steps.resolver_catalog.outputs.ref }}
      run: |
        set -euo pipefail
        test -s .release-basics/network/resolver/endpoints_embed.json
        if ! git -C .release-basics tag --points-at HEAD | grep -Fx -- "$BASICS_REF" >/dev/null; then
          echo "Resolver catalog checkout is not the requested immutable tag: $BASICS_REF" >&2
          exit 1
        fi
        go -C .release-basics test -count=1 ./network/resolver ./cmd/update-resolver-endpoints
        printf 'Embedded resolver catalog from basics %s: ' "$BASICS_REF" >> "$GITHUB_STEP_SUMMARY"
        sha256sum .release-basics/network/resolver/endpoints_embed.json >> "$GITHUB_STEP_SUMMARY"

    - name: Remove temporary resolver catalog checkout
      if: steps.release.outputs.publish == 'true'
      shell: bash
      run: rm -rf .release-basics

    - name: Create public branch
      if: steps.release.outputs.publish == 'true'
      run: |
        # 删除本地 public 分支（如果存在）
        git branch -D public 2>/dev/null || true
        # 基于当前分支创建新的 public 分支（完全覆盖）
        git checkout -b public
        
    - name: Remove security package references
      if: steps.release.outputs.publish == 'true'
      env:
        GOFLAGS: "-mod=mod -tags=ecs_public"
      run: |
        set -euo pipefail
        python3 .back/create_public_branch.py
        go clean -cache -testcache -fuzzcache
        if grep -n -E 'github\.com/oneclickvirt/(security|privatespeedtest)' go.mod; then
          echo "Public go.mod still requires private modules" >&2
          exit 1
        fi
        if go list -deps ./... | grep -E '^github\.com/oneclickvirt/(security|privatespeedtest)(/|$)'; then
          echo "Public build dependency graph still loads private modules" >&2
          exit 1
        fi
    - name: Build and Test
      if: steps.release.outputs.publish == 'true'
      env:
        GOFLAGS: "-mod=mod -tags=ecs_public"
      run: |
        set -euo pipefail
        go test ./...
        go build -ldflags="-checklinkname=0" -o maintest
        ./maintest -h >/dev/null
        go run ./cmd/ecs-canary -offline -canary-deadline 30s > public-canary.json
        python3 - <<'PY'
        import json

        with open("public-canary.json", "r", encoding="utf-8") as handle:
            report = json.load(handle)
        if report.get("schema_version") != "goecs.report/v1":
            raise SystemExit("public canary returned an unexpected schema")
        if report.get("privacy_mode") is not True:
            raise SystemExit("public canary did not enable privacy mode")
        sections = report.get("sections") or []
        expected_sections = {
            "basics", "cpu", "memory", "disk", "media", "security", "email",
            "backtrace", "routes", "ping", "tgdc", "web", "nat", "tcp", "speed",
        }
        names = {item.get("name") for item in sections}
        if names != expected_sections:
            raise SystemExit(f"public canary returned an unexpected section set: {sorted(names)}")
        # Registry provenance and private-loader details are an internal concern;
        # they must never become part of the public report contract.
        encoded = json.dumps(report, ensure_ascii=False).lower()
        for forbidden in ("data", "data_files", "source", "fallback", "manifest", "registry"):
            if f'"{forbidden}"' in encoded:
                raise SystemExit(f"public canary exposed private metadata field: {forbidden}")
        if any(marker in encoded for marker in ("privatespeedtest", "dnsbl-zones", "openspeedtest-servers")):
            raise SystemExit("public canary exposed private registry details")
        PY
        rm -f maintest public-canary.json
        
    - name: Commit and push changes
      if: steps.release.outputs.publish == 'true'
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "Public branch generator produced no changes" >&2
          exit 1
        fi
        git commit -m "Auto update public version"
        git push -f origin public

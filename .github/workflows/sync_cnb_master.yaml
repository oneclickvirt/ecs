name: Sync Source Branches to CNB

on:
  push:
    branches:
      - master
      - public
  workflow_dispatch:
  workflow_run:
    workflows:
      - Public Build
    types:
      - completed
  schedule:
    - cron: '27 * * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CNB_REPOSITORY: https://cnb.cool/oneclickvirt/ecs.git

concurrency:
  group: sync-cnb-source-branches
  cancel-in-progress: false

jobs:
  sync-source:
    if: >-
      github.repository == 'oneclickvirt/ecs' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Push source branches to CNB
        env:
          CNB_USERNAME: ${{ secrets.CNB_USERNAME }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          : "${CNB_USERNAME:?CNB_USERNAME is not configured}"
          : "${CNB_TOKEN:?CNB_TOKEN is not configured}"
          git fetch --no-tags origin \
            +refs/heads/master:refs/remotes/origin/master \
            +refs/heads/public:refs/remotes/origin/public
          git remote add cnb "$CNB_REPOSITORY"
          # CNB main contains the release assets and remains the default branch.
          # shellcheck disable=SC2016 # Git invokes the helper with the step environment.
          git -c credential.helper= \
            -c credential.helper='!f() { test "$1" = get || exit 0; printf "%s\n" "username=${CNB_USERNAME}" "password=${CNB_TOKEN}"; }; f' \
            push --atomic --force cnb \
              refs/remotes/origin/master:refs/heads/master \
              refs/remotes/origin/public:refs/heads/public

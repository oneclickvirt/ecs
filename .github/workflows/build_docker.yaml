name: Build and Push Docker Image
on:
  workflow_run:
    workflows: ["Build and Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build, for example v0.1.181"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: docker-latest-release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve release context
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          RESOLVER=".github/scripts/resolve-release-context.sh"
          if [ -f "$RESOLVER" ]; then
            bash "$RESOLVER"
          else
            git fetch --depth=1 origin master
            git show FETCH_HEAD:"$RESOLVER" | bash
          fi
      - name: Set up QEMU
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Set up Docker Buildx
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # - name: Login to CNB Registry
      #   uses: docker/login-action@v2
      #   with:
      #     registry: ${{ secrets.CNB_DOCKER_REGISTRY }}
      #     username: ${{ secrets.CNB_USERNAME }}
      #     password: ${{ secrets.CNB_TOKEN }}
      
      - name: Login to Aliyun Container Registry
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: crpi-8tmognxgyb86bm61.cn-guangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      
      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker images
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/386,linux/riscv64
          build-args: |
            GOECS_REF=${{ steps.release.outputs.release_sha }}
          # linux/mips,linux/mipsle 暂不支持 alpine, linux/s390x 编译卡死，cnb组织空间不足无法推送
          # ${{ secrets.CNB_DOCKER_REGISTRY }}/oneclickvirt/ecs:latest
          push: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.release_sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.release_tag }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/goecs:latest
            crpi-8tmognxgyb86bm61.cn-guangzhou.personal.cr.aliyuncs.com/oneclickvirt/ecs:latest
            ghcr.io/${{ github.repository_owner }}/goecs:latest

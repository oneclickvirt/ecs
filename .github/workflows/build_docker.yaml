name: Build and Push Docker Image
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  DOCKER_BUILD_SUMMARY: 'false'
concurrency:
  group: docker-latest-release
  cancel-in-progress: false
jobs:
  build:
    if: |-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_tag
          }}
        fetch-depth: 0
        fetch-tags: true
    - name: Resolve release context
      id: release
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        set -euo pipefail
        RESOLVER=".github/scripts/resolve-release-context.sh"
        if [ -f "$RESOLVER" ]; then
          bash "$RESOLVER"
        else
          git fetch --depth=1 origin master
          git show FETCH_HEAD:"$RESOLVER" | bash
        fi
    - name: Set up QEMU
      if: steps.release.outputs.publish == 'true'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: all
        cache-image: false
    - name: Set up Docker Buildx
      if: steps.release.outputs.publish == 'true'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Log in to Docker Hub
      if: steps.release.outputs.publish == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Login to Aliyun Container Registry
      if: steps.release.outputs.publish == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: crpi-8tmognxgyb86bm61.cn-guangzhou.personal.cr.aliyuncs.com
        username: ${{ secrets.ALIYUN_USERNAME }}
        password: ${{ secrets.ALIYUN_PASSWORD }}
    - name: Log in to GitHub Container Registry
      if: steps.release.outputs.publish == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker images
      if: steps.release.outputs.publish == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/386,linux/riscv64
        build-args: |
          GOECS_REF=${{ steps.release.outputs.release_sha }}
        push: true
        provenance: false
        sbom: false
        labels: |
          org.opencontainers.image.revision=${{ steps.release.outputs.release_sha }}
          org.opencontainers.image.version=${{ steps.release.outputs.release_tag }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/goecs:latest
          crpi-8tmognxgyb86bm61.cn-guangzhou.personal.cr.aliyuncs.com/oneclickvirt/ecs:latest
          ghcr.io/${{ github.repository_owner }}/goecs:latest
'on':
  workflow_run:
    workflows:
    - Build and Release
    types:
    - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build, for example v0.1.181
        required: true
        type: string

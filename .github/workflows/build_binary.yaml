name: Build and Release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: '1'
concurrency:
  group: release-publish
  cancel-in-progress: false
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/goreleaser/goreleaser-cross:v1.27.1-3
    env:
      TMPDIR: /__w/_temp/goecs/tmp
      GOTMPDIR: /__w/_temp/goecs/go-tmp
      GOCACHE: /__w/_temp/goecs/go-build
      GOMODCACHE: /__w/_temp/goecs/go-mod
      PRIVATE_CI_TOKEN: ${{ secrets.PRIVATE_CI_TOKEN }}
      CI_JOB_KEY: ${{ github.job }}-${{ strategy.job-index }}
      GOPROXY: https://proxy.golang.org|direct
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/ecs/master/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
    - name: Install CI control tools
      shell: bash
      run: |
        mkdir -p "$TMPDIR" "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE"
        apt-get update -qq
        apt-get install -y --no-install-recommends python3 gh ca-certificates
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: master
    - name: Load trusted CI control
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/private-ci-control"
        cp .github/scripts/private_guard.py "$RUNNER_TEMP/private-ci-control/private_guard.py"
        cp .github/scripts/release_assets.py "$RUNNER_TEMP/private-ci-control/release_assets.py"
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
        fetch-depth: 0
        fetch-tags: true
        token: ${{ secrets.PRIVATE_CI_TOKEN }}
        persist-credentials: false
    - name: Verify release ref
      id: release
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        CI_ALLOWED_ENV: HEAD_COMMIT,RELEASE_TAG,TAG_COMMIT,release_tag
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,HEAD_COMMIT,RELEASE_TAG,TAG_COMMIT,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
          RELEASE_TAG="${RELEASE_TAG:?RELEASE_TAG is required for workflow_dispatch}"
        else
          RELEASE_TAG="${GITHUB_REF#refs/tags/}"
        fi
        [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1; }
        git fetch --force --tags origin
        TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
        HEAD_COMMIT="$(git rev-parse HEAD)"
        if [[ "$TAG_COMMIT" != "$HEAD_COMMIT" ]]; then
          echo "Tag $RELEASE_TAG points to $TAG_COMMIT but HEAD is $HEAD_COMMIT" >&2
          exit 1
        fi
        echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        PRIVATE_STEP
      shell: bash
    - name: Verify release version
      env:
        RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        CI_ALLOWED_ENV: VERSION
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        set -euo pipefail
        VERSION="${RELEASE_TAG#v}"
        grep -Fq "DefaultVersion = \"v$VERSION\"" api/api.go
        # GoECS releases and the legacy Shell implementation are versioned
        # independently. The Shell repository is intentionally not changed
        # as part of a GoECS release, so a matching Shell fallback version is
        # not a valid release gate here.
        PRIVATE_STEP
      shell: bash
    - name: Prepare Go build directories
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        rm -rf .cache .tmp
        mkdir -p "$TMPDIR" "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE"
        df -h
        PRIVATE_STEP
      shell: bash
      env:
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        check-latest: true
        cache: false
      id: setup_go
    - name: Select configured Go toolchain in container
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        set -euo pipefail
        go_version="${{ steps.setup_go.outputs.go-version }}"
        go_version="${go_version#go}"
        case "$(uname -m)" in
          x86_64) cache_arch="x64" ;;
          aarch64|arm64) cache_arch="arm64" ;;
          *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        toolchain_root="/__t/go/${go_version}/${cache_arch}"
        if [[ ! -x "${toolchain_root}/bin/go" ]]; then
          echo "setup-go toolchain is not mounted in the build container: ${toolchain_root}" >&2
          exit 1
        fi
        echo "${toolchain_root}/bin" >> "$GITHUB_PATH"
        echo "GOROOT=${toolchain_root}" >> "$GITHUB_ENV"
        export PATH="${toolchain_root}/bin:${PATH}"
        export GOROOT="${toolchain_root}"
        command -v go
        go version
        [[ "$(go env GOROOT)" == "${toolchain_root}" ]]
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: GOROOT,PATH,cache_arch,go_version,toolchain_root
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GOROOT,GUI_VERSION,PATH,RELEASE_TAG,VERSION,backtrace,basics,cache_arch,cputest,defaultset,disktest,go_version,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,toolchain_root,unlocktests,version
    - name: Resolve component refs from go.mod
      id: component_refs
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        import subprocess

        modules = {
            "unlocktests": "github.com/oneclickvirt/UnlockTests",
            "backtrace": "github.com/oneclickvirt/backtrace",
            "basics": "github.com/oneclickvirt/basics",
            "cputest": "github.com/oneclickvirt/cputest",
            "defaultset": "github.com/oneclickvirt/defaultset",
            "disktest": "github.com/oneclickvirt/disktest",
            "gostun": "github.com/oneclickvirt/gostun",
            "memorytest": "github.com/oneclickvirt/memorytest",
            "nt3": "github.com/oneclickvirt/nt3",
            "pingtest": "github.com/oneclickvirt/pingtest",
            "portchecker": "github.com/oneclickvirt/portchecker",
            "privatespeedtest": "github.com/oneclickvirt/privatespeedtest",
            "security": "github.com/oneclickvirt/security",
            "speedtest": "github.com/oneclickvirt/speedtest",
        }
        go_mod = json.loads(subprocess.check_output(
            ["go", "mod", "edit", "-json"], text=True
        ))
        required = {
            item["Path"]: item["Version"]
            for item in go_mod.get("Require", [])
        }
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            for key, path in modules.items():
                version = required.get(path, "")
                if not version:
                    raise SystemExit(f"{path} is not pinned in go.mod")
                print(f"{key}={version}", file=output)
                print(f"{path} -> {version}")
        PY
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: encoding,file,text
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,encoding,file,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,text,unlocktests,version
    - name: Checkout structured component sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: oneclickvirt/UnlockTests
        ref: ${{ steps.component_refs.outputs.unlocktests }}
        token: ${{ secrets.PRIVATE_CI_TOKEN }}
        path: deps/UnlockTests
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: oneclickvirt/backtrace
        ref: ${{ steps.component_refs.outputs.backtrace }}
        token: ${{ secrets.PRIVATE_CI_TOKEN }}
        path: deps/backtrace
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: oneclickvirt/basics
        ref: ${{ steps.component_refs.outputs.basics }}
        token: ${{ secrets.PRIVATE_CI_TOKEN }}
        path: deps/basics
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: oneclickvirt/cputest
        ref: ${{ steps.component_refs.outputs.cputest }}
        token: ${{ secrets.PRIVATE_CI_TOKEN }}
        path: deps/cputest
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: oneclickvirt/defaultset
        ref: ${{ steps.component_refs.outputs.defaultset }}
        token: ${{ secrets.PRIVATE_CI_TOKEN }}
        path: deps/defaultset
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: oneclickvirt/disktest
        ref: ${{ steps.component_refs.outputs.disktest }}
        token: ${{ secrets.PRIVATE_CI_TOKEN }}
        path: deps/disktest
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: oneclickvirt/gostun
        ref: ${{ steps.component_refs.outputs.gostun }}
        token: ${{ secrets.PRIVATE_CI_TOKEN }}
        path: deps/gostun
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: oneclickvirt/memorytest
        ref: ${{ steps.component_refs.outputs.memorytest }}
        token: ${{ secrets.PRIVATE_CI_TOKEN }}
        path: deps/memorytest
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: oneclickvirt/nt3
        ref: ${{ steps.component_refs.outputs.nt3 }}
        token: ${{ secrets.PRIVATE_CI_TOKEN }}
        path: deps/nt3
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: oneclickvirt/pingtest
        ref: ${{ steps.component_refs.outputs.pingtest }}
        token: ${{ secrets.PRIVATE_CI_TOKEN }}
        path: deps/pingtest
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: oneclickvirt/portchecker
        ref: ${{ steps.component_refs.outputs.portchecker }}
        token: ${{ secrets.PRIVATE_CI_TOKEN }}
        path: deps/portchecker
        persist-credentials: false
    - env:
        CI_CLONE_REPO: oneclickvirt/privatespeedtest
        CI_CLONE_REF: ${{ steps.component_refs.outputs.privatespeedtest }}
        CI_CLONE_PATH: deps/privatespeedtest
      shell: bash
      run: python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" clone --repository "$CI_CLONE_REPO" --destination
        "$CI_CLONE_PATH" --ref "$CI_CLONE_REF"
    - env:
        CI_CLONE_REPO: oneclickvirt/security
        CI_CLONE_REF: ${{ steps.component_refs.outputs.security }}
        CI_CLONE_PATH: deps/security
      shell: bash
      run: python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" clone --repository "$CI_CLONE_REPO" --destination
        "$CI_CLONE_PATH" --ref "$CI_CLONE_REF"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: oneclickvirt/speedtest
        ref: ${{ steps.component_refs.outputs.speedtest }}
        token: ${{ secrets.PRIVATE_CI_TOKEN }}
        path: deps/speedtest
        persist-credentials: false
    - name: Configure structured component workspace
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        set -euo pipefail
        printf '/deps/\n/go.work\n/go.work.sum\n' >> .git/info/exclude
        go work init .
        for module in UnlockTests backtrace basics cputest defaultset disktest gostun memorytest nt3 pingtest portchecker privatespeedtest security speedtest; do
          expected="github.com/oneclickvirt/${module}"
          actual="$(awk '$1 == "module" { print $2; exit }' "deps/${module}/go.mod")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Module path mismatch for ${module}: expected ${expected}, got ${actual:-<empty>}" >&2
            exit 1
          fi
          go work use "deps/${module}"
        done
        export GOWORK="$PWD/go.work"
        for module in UnlockTests backtrace basics cputest defaultset disktest gostun memorytest nt3 pingtest portchecker privatespeedtest security speedtest; do
          resolved="$(go list -m -f '{{.Dir}}' "github.com/oneclickvirt/${module}")"
          expected="$PWD/deps/${module}"
          if [[ "$resolved" != "$expected" ]]; then
            echo "Workspace did not select ${module}: expected ${expected}, got ${resolved:-<empty>}" >&2
            exit 1
          fi
        done
        SPEEDTEST_REF="${{ steps.component_refs.outputs.speedtest }}"
        if ! git -C deps/speedtest tag --points-at HEAD | grep -Fx -- "$SPEEDTEST_REF" >/dev/null; then
          echo "Checked out speedtest source is not the requested immutable tag: $SPEEDTEST_REF" >&2
          exit 1
        fi
        # Workspace-selected modules intentionally report an empty Version
        # from `go list -m`; validate the immutable component ref instead.
        test "$SPEEDTEST_REF" = "v0.0.37"
        test "$(go list -m -f '{{.Version}}' github.com/showwin/speedtest-go)" = "v1.8.3"
        go test -race ./...
        go vet ./...
        git diff --exit-code -- go.mod go.sum
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: GOWORK,SPEEDTEST_REF,actual,expected,resolved
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GOWORK,GUI_VERSION,RELEASE_TAG,SPEEDTEST_REF,VERSION,actual,backtrace,basics,cputest,defaultset,disktest,expected,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,resolved,security,speedtest,tag,unlocktests,version
    - name: Verify embedded encrypted DNS catalog
      shell: bash
      env:
        BASICS_REF: ${{ steps.component_refs.outputs.basics }}
        CI_ALLOWED_ENV: GOWORK,count
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GOWORK,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,count,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        set -euo pipefail
        test -s deps/basics/network/resolver/endpoints_embed.json
        if ! git -C deps/basics tag --points-at HEAD | grep -Fx -- "$BASICS_REF" >/dev/null; then
          echo "Checked out basics source is not the requested immutable tag: $BASICS_REF" >&2
          exit 1
        fi
        export GOWORK="$PWD/go.work"
        go test -race -count=1 ./deps/basics/network/resolver ./deps/basics/cmd/update-resolver-endpoints
        sha256sum deps/basics/network/resolver/endpoints_embed.json
        PRIVATE_STEP
    - name: Run embedded-registry canary
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        set -euo pipefail
        export GOWORK="$PWD/go.work"
        output="$TMPDIR/offline-canary.json"
        go run ./cmd/ecs-canary -offline -canary-deadline 30s > "$output"
        python3 - "$output" <<'PY'
        import json
        import sys

        with open(sys.argv[1], "r", encoding="utf-8") as handle:
            report = json.load(handle)
        if report.get("schema_version") != "goecs.report/v1":
            raise SystemExit("offline canary returned an unexpected schema")
        if report.get("privacy_mode") is not True:
            raise SystemExit("offline canary did not enable privacy mode")
        sections = report.get("sections") or []
        expected_sections = {
            "basics", "cpu", "memory", "disk", "media", "security", "email",
            "backtrace", "routes", "ping", "tgdc", "web", "nat", "tcp", "speed",
        }
        names = {item.get("name") for item in sections}
        if names != expected_sections:
            raise SystemExit(f"offline canary returned an unexpected section set: {sorted(names)}")
        encoded = json.dumps(report, ensure_ascii=False).lower()
        for forbidden in ("data", "data_files", "source", "fallback", "manifest", "registry"):
            if f'"{forbidden}"' in encoded:
                raise SystemExit(f"offline canary exposed private metadata field: {forbidden}")
        PY
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: GOWORK,encoding,ensure_ascii,output
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GOWORK,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,encoding,ensure_ascii,gostun,memorytest,nt3,output,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Clean Go build cache before build
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        rm -rf "$TMPDIR" "$GOTMPDIR"
        mkdir -p "$TMPDIR" "$GOTMPDIR"
        go clean -cache -testcache
        available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
        if [[ -z "$available_kb" || "$available_kb" -lt 5242880 ]]; then
          echo "Insufficient release disk space: ${available_kb:-unknown} KiB available" >&2
          exit 1
        fi
        df -h
        PRIVATE_STEP
      shell: bash
      env:
        CI_ALLOWED_ENV: available_kb
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,available_kb,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Download Go modules
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        go mod download
        PRIVATE_STEP
      env:
        GOPRIVATE: github.com/oneclickvirt/security,github.com/oneclickvirt/privatespeedtest
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
      shell: bash
    - name: Run GoReleaser
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GOPRIVATE: github.com/oneclickvirt/security,github.com/oneclickvirt/privatespeedtest
        RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        CI_ALLOWED_ENV: GH_TOKEN,skip
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GH_TOKEN,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,skip,speedtest,tag,unlocktests,version
        GOFLAGS: -trimpath -buildvcs=false
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        source "$RUNNER_TEMP/ci-network.sh"
        tool_dir="$RUNNER_TEMP/private-ci-tools/goreleaser-v2.18.3"
        mkdir -p "$tool_dir"
        curl -fsSL --retry 3 --connect-timeout 10 --max-time 180 \
          https://github.com/goreleaser/goreleaser/releases/download/v2.18.3/goreleaser_Linux_x86_64.tar.gz \
          -o "$tool_dir/goreleaser.tar.gz"
        printf '%s  %s\n' b8dee4728bca1aba0d71a832a17cd0a3799f75372878e7ffa36aef2343bce0bc "$tool_dir/goreleaser.tar.gz" | sha256sum -c -
        tar -xzf "$tool_dir/goreleaser.tar.gz" --no-same-owner -C "$tool_dir" goreleaser
        "$tool_dir/goreleaser" release --clean --parallelism 1 --skip=publish
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" verify-assets --assets "dist/*.zip" dist/checksums.txt
        export GH_TOKEN="$GITHUB_TOKEN"
        gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft
        python3 "$RUNNER_TEMP/private-ci-control/release_assets.py" "$RELEASE_TAG" dist/*.zip dist/checksums.txt
        gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
        PRIVATE_STEP
    - name: Save diagnostics privately
      if: always()
      shell: bash
      env:
        CI_JOB_STATUS: ${{ job.status }}
      run: |
        if [[ -f "$RUNNER_TEMP/private-ci-control/private_guard.py" ]]; then
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" archive --repositories security,privatespeedtest --status "$CI_JOB_STATUS"
        fi
    - name: Remove private workspace
      if: always()
      shell: bash
      run: |
        if [[ -f "$RUNNER_TEMP/private-ci-control/private_guard.py" ]]; then
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" clean
        rm -rf deps keystore
        find . -maxdepth 1 -type f -name "*.jks" -delete

        fi
    if: github.repository_owner == 'oneclickvirt' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/master'
      || startsWith(github.ref, 'refs/tags/v'))
'on':
  push:
    tags:
    - v*.*.*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing git tag to release, for example v0.1.143
        required: true
        type: string

name: Sync Latest Release

on:
  workflow_run:
    workflows: ["Build and Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to sync, for example v0.1.181"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: sync-latest-release
  cancel-in-progress: false

jobs:
  sync-release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve release context
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git show origin/master:.github/scripts/resolve-release-context.sh | bash
      - name: Create temporary directory
        if: steps.release.outputs.publish == 'true'
        run: |
          mkdir -p temp_repo
          cd temp_repo
          git init
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          
      - name: Copy repository files
        if: steps.release.outputs.publish == 'true'
        run: |
          cp goecs.sh temp_repo/
          cp README.md temp_repo/
          [ -f "README_EN.md" ] && cp README_EN.md temp_repo/ || true
          [ -f "README_ZH.md" ] && cp README_ZH.md temp_repo/ || true
          cp LICENSE temp_repo/
          
      - name: Download release assets
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd temp_repo
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --dir .
          
      - name: Push to target repository
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          CNB_USERNAME: ${{ secrets.CNB_USERNAME }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          NETRC_PATH="$HOME/.netrc"
          trap 'rm -f "$NETRC_PATH"' EXIT
          cd temp_repo
          git add .
          git commit -m "Sync release $RELEASE_TAG from ${{ github.repository }}"
          git branch -M main
          git remote add target https://cnb.cool/oneclickvirt/ecs.git
          printf 'machine cnb.cool\nlogin %s\npassword %s\n' "$CNB_USERNAME" "$CNB_TOKEN" > "$NETRC_PATH"
          chmod 600 "$NETRC_PATH"
          git push -f target main

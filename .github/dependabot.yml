version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    actions-patch-minor:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    actions-major:
      patterns:
      - '*'
      update-types:
      - major
  open-pull-requests-limit: 5
